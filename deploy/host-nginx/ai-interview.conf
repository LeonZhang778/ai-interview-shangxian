# AI Interview - 主机 Nginx 配置
# 作用: SSL 终止 + HTTP→HTTPS 重定向 + 反向代理到 Docker Nginx (:8080)
# 部署路径: /etc/nginx/sites-available/ai-interview
# 部署方式: GitHub Actions 自动部署 (见 .github/workflows/main.yml)

# ==================== HTTP (80) ====================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name zhangzhengqiang.xyz www.zhangzhengqiang.xyz 8.166.120.119;

    # Let's Encrypt 证书验证 (certbot renew 需要)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 健康检查不重定向 —— GitHub Actions 部署流水线依赖此路径返回 200
    location /api/v1/config/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 其他所有请求 → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==================== HTTPS (443) ====================
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name zhangzhengqiang.xyz www.zhangzhengqiang.xyz 8.166.120.119;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/zhangzhengqiang.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhangzhengqiang.xyz/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    # Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 反向代理到 Docker Nginx
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
