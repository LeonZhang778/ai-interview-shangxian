server {
    listen 8080;
    server_name _;

    # 健康检查
    location /health {
        proxy_pass http://app:8006/api/v1/config/health;
        access_log off;
    }

    # 管理后台 (必须在 / 之前匹配)
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
    # 同上：管理端的指纹产物缺失时返回真 404，不要回退 HTML
    location /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        try_files $uri =404;
    }
    location = /admin {
        return 301 /admin/;
    }

    # API 代理
    location /api/ {
        proxy_pass http://app:8006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出支持
        proxy_buffering off;
        proxy_cache off;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
    }

    # 上传文件访问
    location /uploads/ {
        proxy_pass http://app:8006;
    }

    # 后端文档 (可选, 上线后可注释掉)
    location /client/ {
        proxy_pass http://app:8006;
    }
    location /backoffice/ {
        proxy_pass http://app:8006;
    }

    # 用户端前端 (最后匹配)
    location / {
        root /usr/share/nginx/html/frontend;
        try_files $uri $uri/ /index.html;
    }

    # 带内容指纹的构建产物（assets/index-<hash>.js）不存在时必须真 404，
    # 不能回退到 index.html。回退会让浏览器拿到 text/html 却按 JS 解析，
    # 报出与真实原因（前端版本错配 / 部署不完整）完全无关的语法错误。
    location /assets/ {
        root /usr/share/nginx/html/frontend;
        try_files $uri =404;
    }

    # 文件上传大小，与 FastAPI MEDIA_MAX_FILE_SIZE_MB=500 保持一致。
    client_max_body_size 500M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
