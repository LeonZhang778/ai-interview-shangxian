# ruff 规则集：只启用「会导致运行时出错」的检查，作为 CI 门禁。
#
# 为什么不用默认规则集：默认包含大量未使用导入（F401）等风格项，本仓库历史积累较多，
# 一次性全开会让门禁长期变红、进而被无视 —— 那就是「形式上的门禁」，比没有更糟。
# 这里只保留真正会出错的规则：
#   E9  : 语法错误（如括号不匹配）
#   F63 : 比较类笔误（如 == 写成 is）
#   F7  : 语法相关（如 return 在 finally 外的用法）
#   F82 : 未定义名/未绑定局部变量（NameError 来源）
#   F811: 重复定义遮蔽（曾据此发现 analytics.py 中第二个 /geo-distribution 处理器
#         不可达、admin 端「省份 Top 10」永久为空的问题）
#
# 后续若要收紧，建议按目录逐步启用，而不是一次性全开。

target-version = "py311"
line-length = 120

[lint]
select = ["E9", "F63", "F7", "F82", "F811"]
