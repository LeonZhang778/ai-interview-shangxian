# 生产环境覆盖层（可选）
#
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ⚠️ 现状说明：当前 CI 与部署脚本**只使用 docker-compose.yml**，不加载本文件。
#    因此所有必须生效的加固（端口收敛 / 日志轮转 / 内存上限 / Redis AOF）
#    已全部下沉到基础文件，避免出现「看起来配了、实际没生效」的假象。
#
# 历史问题：本文件曾把 nginx 发布到宿主机 80/443，但当前拓扑是对外的 80/443
# 由**宿主机 nginx** 接管 TLS 后反代到容器 127.0.0.1:8080。若叠加本文件会造成
# 端口冲突使部署失败，这也是它一直没被启用的原因之一。
#
# 本文件现在只做一件事：显式声明运行环境为 production。

services:
  app:
    environment:
      - ENV=production

  celery-worker:
    environment:
      - ENV=production

  celery-beat:
    environment:
      - ENV=production
