# 生产环境配置 - 覆盖基础配置
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    ports:
      - "127.0.0.1:${API_PORT:-8006}:${API_PORT:-8006}"
    environment:
      - ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-worker:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    ports: []
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    ports: []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
