<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">AI-Interview practice workflow</title>
  <desc id="desc">Resume parsing flows into a multi-turn AI interview, then into evaluation and learning review.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#0f9f8f" />
      <stop offset="0.52" stop-color="#e3a42f" />
      <stop offset="1" stop-color="#5478d4" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="818" height="218" rx="12" fill="#f8fafc" stroke="#dce3ea" />
  <path d="M186 112 H634" fill="none" stroke="#d4dce4" stroke-width="3" />
  <path d="M186 112 H634" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="12 14" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="52" to="0" dur="2.8s" repeatCount="indefinite" />
  </path>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <g>
      <rect x="24" y="56" width="162" height="112" rx="10" fill="#ffffff" stroke="#b8dcd5" />
      <circle cx="105" cy="90" r="17" fill="#e3f3ef" />
      <path d="M98 90h14M105 83v14" stroke="#0f8c7f" stroke-width="2.5" stroke-linecap="round" />
      <text x="105" y="132" fill="#18212b" font-size="15" font-weight="650">简历解析</text>
      <text x="105" y="152" fill="#697586" font-size="11">经历 · 技能 · 目标岗位</text>
    </g>
    <g>
      <rect x="230" y="56" width="162" height="112" rx="10" fill="#ffffff" stroke="#ead6a9" />
      <circle cx="311" cy="90" r="17" fill="#fbf1dc" />
      <path d="M304 84h14v11h-8l-5 4z" fill="none" stroke="#bd8116" stroke-width="2" stroke-linejoin="round" />
      <text x="311" y="132" fill="#18212b" font-size="15" font-weight="650">多轮面试</text>
      <text x="311" y="152" fill="#697586" font-size="11">追问 · 回答 · 实时反馈</text>
    </g>
    <g>
      <rect x="436" y="56" width="162" height="112" rx="10" fill="#ffffff" stroke="#c9d5ef" />
      <circle cx="517" cy="90" r="17" fill="#e9eefb" />
      <path d="M509 96v-8m8 8V82m8 14v-5" stroke="#496cc3" stroke-width="2.5" stroke-linecap="round" />
      <text x="517" y="132" fill="#18212b" font-size="15" font-weight="650">评估报告</text>
      <text x="517" y="152" fill="#697586" font-size="11">表现 · 证据 · 提升方向</text>
    </g>
    <g>
      <rect x="634" y="56" width="162" height="112" rx="10" fill="#ffffff" stroke="#c9d5ef" />
      <circle cx="715" cy="90" r="17" fill="#e9eefb" />
      <path d="M708 84h14v13h-14zM711 88h8m-8 4h8" fill="none" stroke="#496cc3" stroke-width="2" stroke-linecap="round" />
      <text x="715" y="132" fill="#18212b" font-size="15" font-weight="650">持续复盘</text>
      <text x="715" y="152" fill="#697586" font-size="11">笔记 · 闪卡 · 薄弱项</text>
    </g>
  </g>
  <circle r="5" fill="#0f9f8f" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M186 112 H634" />
  </circle>
</svg>
