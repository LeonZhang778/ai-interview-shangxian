name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ACR build (polling digest)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            set -e

            ACR_IMAGE="${{ secrets.ACR_REGISTRY }}/rwkkyyds-ai-interviews/ai-interviews-shangxian:latest"

            echo "${{ secrets.ACR_PASSWORD }}" | docker login \
              --username="${{ secrets.ACR_USERNAME }}" --password-stdin \
              ${{ secrets.ACR_REGISTRY }}

            # 记录当前镜像 digest
            OLD_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ACR_IMAGE" 2>/dev/null | grep -o 'sha256:[a-f0-9]*' || echo "none")
            echo "Current digest: $OLD_DIGEST"

            # 轮询 ACR 直到新镜像可用（最多 5 分钟，每 15 秒检查一次）
            for i in $(seq 1 20); do
              docker pull "$ACR_IMAGE" 2>/dev/null || true
              NEW_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ACR_IMAGE" 2>/dev/null | grep -o 'sha256:[a-f0-9]*' || echo "none")

              if [ "$NEW_DIGEST" != "none" ] && [ "$NEW_DIGEST" != "$OLD_DIGEST" ]; then
                echo "New image available! digest: $NEW_DIGEST"
                exit 0
              fi

              echo "Waiting for ACR build ($i/20): digest unchanged, retrying in 15s..."
              sleep 15
            done

            echo "Warning: ACR digest unchanged after 5 minutes, proceeding with current image"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            cd /home/deploy/ai-interview
            git stash || true
            git pull origin main

            cd ai-interview-backend
            docker compose stop app celery-worker celery-beat || true
            docker compose up -d --force-recreate --no-deps app celery-worker celery-beat

            for i in $(seq 1 12); do
              APP_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ai-interview-app 2>/dev/null || echo "missing")
              if [ "$APP_HEALTH" = "healthy" ]; then
                break
              fi
              echo "Waiting for app container health ($i/12): $APP_HEALTH"
              sleep 5
            done

            docker compose up -d --build --force-recreate --no-deps nginx

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            echo "Waiting for containers..."
            sleep 8

            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/v1/config/health 2>/dev/null)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (HTTP $STATUS)"
                exit 0
              fi

              APP_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ai-interview-app 2>/dev/null || echo "missing")
              DIRECT_STATUS=$(docker exec ai-interview-app python -c "import os, urllib.request; port=os.getenv('API_PORT','8006'); print(urllib.request.urlopen(f'http://localhost:{port}/api/v1/config/health', timeout=3).status)" 2>/dev/null || echo "failed")
              echo "Health check $i/12 failed: nginx HTTP $STATUS, app health $APP_HEALTH, direct app HTTP $DIRECT_STATUS"
              sleep 5
            done

            echo "Health check failed. Container status:"
            docker ps -a --filter name=ai-interview

            echo "App logs:"
            docker logs ai-interview-app --tail 30 || true

            echo "Nginx logs:"
            docker logs ai-interview-nginx --tail 50 || true

            echo "Nginx error log:"
            docker exec ai-interview-nginx sh -c 'tail -n 50 /var/log/nginx/error.log' || true

            exit 1
