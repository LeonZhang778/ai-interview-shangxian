name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_REPOSITORY: ${{ secrets.ACR_REGISTRY }}/rwkkyyds-ai-interviews/ai-interviews-shangxian
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            -t "$IMAGE_REPOSITORY:latest" \
            ./ai-interview-backend

      - name: Push backend image
        run: |
          docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$IMAGE_REPOSITORY:latest"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 12m
          envs: BACKEND_IMAGE,DEPLOY_COMMIT
          script: |
            set -e

            echo "Deploy commit: $DEPLOY_COMMIT"
            echo "Deploy image: $BACKEND_IMAGE"

            cd /home/deploy/ai-interview
            git stash || true
            git pull origin main
            echo "Server git commit:"
            git log -1 --oneline

            cd ai-interview-backend
            export BACKEND_IMAGE="$BACKEND_IMAGE"

            docker pull "$BACKEND_IMAGE"
            docker image inspect "$BACKEND_IMAGE" --format 'Pulled image={{.Id}}'

            docker compose stop app celery-worker celery-beat || true

            docker compose up -d --force-recreate --no-deps app
            for i in $(seq 1 12); do
              APP_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ai-interview-app 2>/dev/null || echo "missing")
              if [ "$APP_HEALTH" = "healthy" ]; then
                break
              fi
              echo "Waiting for app container health ($i/12): $APP_HEALTH"
              sleep 5
            done

            APP_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ai-interview-app 2>/dev/null || echo "missing")
            if [ "$APP_HEALTH" != "healthy" ]; then
              echo "App failed to become healthy."
              docker logs ai-interview-app --tail 100 || true
              exit 1
            fi

            docker compose up -d --force-recreate --no-deps celery-worker
            docker compose up -d --force-recreate --no-deps celery-beat
            docker compose up -d --build --force-recreate --no-deps nginx

            # Deploy host Nginx config (SSL termination + reverse proxy to Docker Nginx)
            echo "Deploying host Nginx config..."
            mkdir -p /var/www/letsencrypt
            cp /home/deploy/ai-interview/deploy/host-nginx/ai-interview.conf /etc/nginx/sites-available/ai-interview
            rm -f /etc/nginx/sites-enabled/default
            ln -sf /etc/nginx/sites-available/ai-interview /etc/nginx/sites-enabled/ai-interview
            nginx -t && systemctl reload nginx || systemctl start nginx
            echo "Host Nginx deployed OK"

            echo "Container summary:"
            docker compose ps
            echo "App container:"
            docker inspect ai-interview-app --format 'ID={{.Id}} Image={{.Image}} StartedAt={{.State.StartedAt}}'
            echo "Worker container:"
            docker inspect ai-interview-celery-worker --format 'ID={{.Id}} Image={{.Image}} StartedAt={{.State.StartedAt}}'
            echo "Beat container:"
            docker inspect ai-interview-celery-beat --format 'ID={{.Id}} Image={{.Image}} StartedAt={{.State.StartedAt}}'
            echo "Nginx container:"
            docker inspect ai-interview-nginx --format 'ID={{.Id}} Image={{.Image}} StartedAt={{.State.StartedAt}}'

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e

            echo "Waiting for containers..."
            sleep 8

            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/v1/config/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (HTTP $STATUS)"
                exit 0
              fi

              APP_HEALTH=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ai-interview-app 2>/dev/null || echo "missing")
              DIRECT_STATUS=$(docker exec ai-interview-app python -c "import os, urllib.request; port=os.getenv('API_PORT','8006'); print(urllib.request.urlopen(f'http://localhost:{port}/api/v1/config/health', timeout=3).status)" 2>/dev/null || echo "failed")
              echo "Health check $i/12 failed: nginx HTTP $STATUS, app health $APP_HEALTH, direct app HTTP $DIRECT_STATUS"
              sleep 5
            done

            echo "Health check failed. Container status:"
            docker ps -a --filter name=ai-interview

            echo "App logs:"
            docker logs ai-interview-app --tail 50 || true

            echo "Worker logs:"
            docker logs ai-interview-celery-worker --tail 50 || true

            echo "Beat logs:"
            docker logs ai-interview-celery-beat --tail 50 || true

            echo "Nginx logs:"
            docker logs ai-interview-nginx --tail 50 || true

            echo "Nginx error log:"
            docker exec ai-interview-nginx sh -c 'tail -n 50 /var/log/nginx/error.log' || true

            exit 1
