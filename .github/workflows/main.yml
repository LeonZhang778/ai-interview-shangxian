name: Deploy

on:
  push:
    branches: [main]

# 同一分支只保留最新一次部署：新推送自动取消仍在排队或运行中的旧运行。
# 背景：曾出现构建卡死 30-56 分钟未结束、被后续推送顶掉的情况，白白占用 runner 与 Actions 配额。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ secrets.ACR_REGISTRY }}/rwkkyyds-ai-interviews/ai-interviews-shangxian
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 架构说明：镜像改为【在服务器侧构建】，GitHub runner 不再执行 docker build/push。
    # 根因：海外 runner 向广州 ACR 推送镜像属跨境传输，高延迟+丢包下单层镜像即耗时
    # 14 分钟以上（实测 a6dc765193a5 层 14 分钟、其后一层 15 分钟未完成），30 分钟护栏
    # 反复被撞满导致 build 成功但部署从未执行。服务器在国内，构建与推送 ACR 均为同城/内网。
    # 护栏：正常全流程（服务器构建+部署）约 8-15 分钟；超过 40 分钟视为异常。
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AI_QWEN_API_KEY: ${{ secrets.AI_QWEN_API_KEY }}
        run: |
          set -Eeuo pipefail

          required_secrets="ACR_REGISTRY ACR_USERNAME ACR_PASSWORD SERVER_HOST SERVER_USER SERVER_PASSWORD AI_API_KEY POLLINATIONS_API_KEY POSTGRES_PASSWORD REDIS_PASSWORD AI_QWEN_API_KEY"
          for secret_name in $required_secrets; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

      - name: Run evaluation gate
        run: python3 ai-interview-backend/scripts/eval_gate.py

      # 注意：此处【不再】执行 docker build / docker push。
      # 镜像构建与推送已下移到「Deploy to server」步骤，在服务器（国内）完成，
      # 以规避海外 runner → 广州 ACR 的跨境推送瓶颈。详见 job 顶部架构说明。

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          DEPLOY_COMMIT: ${{ github.sha }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_QWEN_API_KEY: ${{ secrets.AI_QWEN_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          envs: BACKEND_IMAGE,IMAGE_REPOSITORY,DEPLOY_COMMIT,ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,AI_API_KEY,AI_QWEN_API_KEY,POLLINATIONS_API_KEY,POSTGRES_PASSWORD,REDIS_PASSWORD
          script: |
            set -Eeuo pipefail

            required_secrets="AI_API_KEY AI_QWEN_API_KEY POLLINATIONS_API_KEY POSTGRES_PASSWORD REDIS_PASSWORD"
            for secret_name in $required_secrets; do
              if [ -z "${!secret_name:-}" ]; then
                echo "Missing required GitHub Actions secret: $secret_name"
                exit 1
              fi
            done

            cd /home/deploy/ai-interview
            git stash push --include-untracked --message "deploy-$DEPLOY_COMMIT" || true
            git pull --ff-only origin main
            cd ai-interview-backend

            echo "Deploy commit: $DEPLOY_COMMIT"
            echo "Deploy image: $BACKEND_IMAGE"
            echo "Disk usage:"
            df -h / /home
            echo "Container status before deploy:"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            timestamp=$(date +%Y%m%d%H%M%S)
            backup_dir="/home/deploy/ai-interview/backups"
            mkdir -p "$backup_dir"

            echo "Backing up PostgreSQL..."
            docker exec ai-interview-postgres pg_dump -U postgres -d postgres -Fc > "$backup_dir/postgres-$timestamp.dump"
            test -s "$backup_dir/postgres-$timestamp.dump"
            chmod 600 "$backup_dir/postgres-$timestamp.dump"

            echo "Backing up current .env..."
            if [ -f .env ]; then
              cp -p .env "$backup_dir/env-$timestamp.backup"
              chmod 600 "$backup_dir/env-$timestamp.backup"
            fi

            echo "Synchronizing PostgreSQL password after backup..."
            postgres_password_sql=${POSTGRES_PASSWORD//\'/\'\'}
            printf "ALTER ROLE postgres PASSWORD '%s';\n" "$postgres_password_sql" \
              | docker exec -i ai-interview-postgres psql -U postgres -d postgres \
                  -v ON_ERROR_STOP=1

            export BACKEND_IMAGE="$BACKEND_IMAGE"

            echo "Writing complete .env..."

            POLLINATIONS_API_KEY="$POLLINATIONS_API_KEY" \
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            REDIS_PASSWORD="$REDIS_PASSWORD" \
            python3 - <<'PY'
            import os
            import re
            from pathlib import Path

            env_path = Path('.env')
            existing = env_path.read_text(encoding='utf-8') if env_path.exists() else ''
            values = {
                'ENV': 'production',
                'PROJECT_NAME': 'AI-Interview',
                'API_V1_STR': '/api/v1',
                'API_PORT': '8006',
                'API_WORKERS': '2',

                'POSTGRES_USER': 'postgres',
                'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
                'POSTGRES_HOST': 'postgres',
                'POSTGRES_PORT': '5432',
                'POSTGRES_DB': 'postgres',
                'REDIS_HOST': 'redis',
                'REDIS_PORT': '6379',
                'REDIS_PASSWORD': os.environ['REDIS_PASSWORD'],
                'XAI_API_KEY': os.environ['AI_API_KEY'],
                'GROK_MODELS_BASE_URL': 'https://sub.anzhiyu.com/v1',
                'GROK_MODEL': 'grok-4.3',
                'AI_API_KEY': os.environ['AI_API_KEY'],
                'AI_BASE_URL': 'https://sub.anzhiyu.com/v1',
                'AI_MODEL': 'grok-4.3',
                'AI_QWEN_API_KEY': os.environ['AI_QWEN_API_KEY'],
                'AI_QWEN_BASE_URL': 'https://dashscope.aliyuncs.com/compatible-mode/v1',
                'AI_QWEN_MODEL': 'qwen-plus',
                'POLLINATIONS_API_KEY': os.environ['POLLINATIONS_API_KEY'],
            }

            output = []
            seen = set()
            assignment = re.compile(r'^([A-Za-z_][A-Za-z0-9_]*)=(.*)$')
            for line in existing.splitlines():
                match = assignment.match(line)
                if not match:
                    if line.strip() or output:
                        output.append(line)
                    continue
                key = match.group(1)
                if key in values:
                    output.append(f'{key}={values[key]}')
                    seen.add(key)
                else:
                    output.append(line)

            if output and output[-1] != '':
                output.append('')
            for key, value in values.items():
                if key not in seen:
                    output.append(f'{key}={value}')

            env_path.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
            PY
            chmod 600 .env

            echo "Validating required .env variables..."
            required_env="ENV API_V1_STR API_PORT API_WORKERS POSTGRES_USER POSTGRES_PASSWORD POSTGRES_HOST POSTGRES_PORT POSTGRES_DB REDIS_HOST REDIS_PORT REDIS_PASSWORD XAI_API_KEY GROK_MODELS_BASE_URL GROK_MODEL AI_API_KEY AI_BASE_URL AI_MODEL AI_QWEN_API_KEY AI_QWEN_BASE_URL AI_QWEN_MODEL POLLINATIONS_API_KEY"
            for env_name in $required_env; do
              if ! grep -q "^${env_name}=" .env; then
                echo "Missing required .env variable: $env_name"
                exit 1
              fi
            done

            echo "Validating Docker Compose configuration..."
            compose_config="/tmp/ai-interview-compose-$timestamp.yml"
            docker compose config > "$compose_config"
            grep -q 'POSTGRES_USER: postgres' "$compose_config"
            grep -q 'POSTGRES_DB: postgres' "$compose_config"
            grep -q 'container_name: ai-interview-app' "$compose_config"

            echo "Building backend image on server (规避海外 runner 跨境 push 瓶颈)..."
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
            # 服务器在国内，apt 走阿里云源最快（与 Dockerfile 的 ARG APT_MIRROR 对应）
            docker build \
              --build-arg APT_MIRROR=mirrors.aliyun.com \
              --build-arg PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/ \
              -t "$BACKEND_IMAGE" \
              -t "$IMAGE_REPOSITORY:latest" \
              .
            docker image inspect "$BACKEND_IMAGE" --format 'Built image={{.Id}}'

            echo "Pushing image to ACR (国内同城，快速)..."
            docker push "$BACKEND_IMAGE"
            docker push "$IMAGE_REPOSITORY:latest"

            echo "Starting PostgreSQL and Redis..."
            docker compose up -d --force-recreate postgres redis
            for i in $(seq 1 30); do
              postgres_status=$(docker inspect --format='{{.State.Health.Status}}' ai-interview-postgres 2>/dev/null || echo missing)
              redis_status=$(docker inspect --format='{{.State.Health.Status}}' ai-interview-redis 2>/dev/null || echo missing)
              if [ "$postgres_status" = healthy ] && [ "$redis_status" = healthy ]; then
                break
              fi
              echo "Waiting for PostgreSQL/Redis healthy ($i/30): postgres=$postgres_status redis=$redis_status"
              sleep 5
            done
            test "$(docker inspect --format='{{.State.Health.Status}}' ai-interview-postgres)" = healthy
            test "$(docker inspect --format='{{.State.Health.Status}}' ai-interview-redis)" = healthy

            echo "Starting app..."
            docker compose up -d --force-recreate --no-deps app
            echo "Waiting for app process and HTTP health..."
            app_ready=false
            for i in $(seq 1 36); do
              app_status=$(docker inspect --format='{{.State.Status}}' ai-interview-app 2>/dev/null || echo missing)
              if [ "$app_status" != "running" ]; then
                echo "Waiting for app running ($i/36): $app_status"
                sleep 5
                continue
              fi

              direct_health_status=$(docker exec ai-interview-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8006/api/v1/config/health', timeout=5).status)" 2>/dev/null || true)
              echo "App readiness check ($i/36): status=$app_status http=${direct_health_status:-unavailable}"
              if [ "$direct_health_status" = "200" ]; then
                app_ready=true
                break
              fi
              sleep 5
            done

            if [ "$app_ready" != "true" ]; then
              echo "App failed to become ready; collecting diagnostics..."
              docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}}' ai-interview-app || true
              docker logs ai-interview-app --tail 200 || true
              exit 1
            fi

            echo "Running database migrations..."
            docker exec ai-interview-app alembic upgrade head

            echo "Checking direct app health after migrations..."
            direct_health_status=$(docker exec ai-interview-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8006/api/v1/config/health', timeout=5).status)")
            test "$direct_health_status" = 200

            echo "Starting Celery worker..."
            docker compose up -d --force-recreate --no-deps celery-worker
            echo "Starting Celery beat..."
            docker compose up -d --force-recreate --no-deps celery-beat

            echo "Starting or reloading Nginx..."
            docker compose up -d --force-recreate --no-deps nginx

            echo "Deploying host Nginx config..."
            mkdir -p /var/www/letsencrypt
            cp /home/deploy/ai-interview/deploy/host-nginx/ai-interview.conf /etc/nginx/sites-available/ai-interview
            rm -f /etc/nginx/sites-enabled/default
            ln -sf /etc/nginx/sites-available/ai-interview /etc/nginx/sites-enabled/ai-interview
            nginx -t
            systemctl reload nginx || systemctl start nginx

            echo "Checking public health..."
            public_health_status=$(curl -sS -o /tmp/ai-interview-health.json -w '%{http_code}' http://localhost:80/api/v1/config/health)
            test "$public_health_status" = 200

            echo "Checking frontend, admin and API..."
            frontend_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/)
            admin_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/admin/)
            api_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/api/v1/config/release)
            echo "HTTPS status: frontend=$frontend_status admin=$admin_status api=$api_status"
            test "$frontend_status" = 200
            test "$admin_status" = 200
            test "$api_status" = 200

            echo "Final container status:"
            docker compose ps

            echo "Cleaning old backend images..."
            backend_repo="${BACKEND_IMAGE%:*}"
            current_backend_image_id=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
            docker image ls "$backend_repo" --format '{{.Repository}}:{{.Tag}}' \
              | while read -r image_ref; do
                  if [ -z "$image_ref" ] || [ "$image_ref" = "$BACKEND_IMAGE" ]; then
                    continue
                  fi

                  image_id=$(docker image inspect "$image_ref" --format '{{.Id}}' 2>/dev/null || true)
                  if [ -n "$image_id" ] && [ "$image_id" != "$current_backend_image_id" ]; then
                    echo "Removing old backend image: $image_ref"
                    docker image rm -f "$image_ref" || true
                  fi
                done
            docker image prune -f || true
            docker builder prune -f || true
            docker system df || true

            echo "Deployment completed successfully."

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -Eeuo pipefail

            echo "Waiting for containers..."
            for i in $(seq 1 12); do
              status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/api/v1/config/health || true)
              basic_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/health || true)
              if [ "$status" = 200 ] && [ "$basic_status" = 200 ]; then
                echo "Health checks passed: detailed=$status basic=$basic_status"
                exit 0
              fi
              echo "Health check $i/12 failed: detailed=$status basic=$basic_status"
              sleep 5
            done

            docker compose -f /home/deploy/ai-interview/ai-interview-backend/docker-compose.yml ps || true
            docker logs ai-interview-app --tail 100 || true
            docker logs ai-interview-celery-worker --tail 50 || true
            docker logs ai-interview-celery-beat --tail 50 || true
            exit 1
