name: Deploy

on:
  push:
    branches: [main]

# 同一分支只保留最新一次部署：新推送自动取消仍在排队或运行中的旧运行。
# 背景：曾出现构建卡死 30-56 分钟未结束、被后续推送顶掉的情况，白白占用 runner 与 Actions 配额。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ${{ secrets.ACR_REGISTRY }}/rwkkyyds-ai-interviews/ai-interviews-shangxian
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 说明：镜像在 GitHub runner 侧构建并推送到 ACR，再由服务器拉取部署。
    # 服务器公网带宽实测仅 ~2.4Mbps（300KB/s），无法承担 apt+pip 约 1.4GB 下载，
    # 故不在服务器侧构建；runner 为海外节点，构建本身很快（约 1 分钟）。
    # 瓶颈仅在于"把新增的大层跨境推送到广州 ACR"：apt 层 966MB + pip 层 455MB。
    # 护栏：常态部署约 10-15 分钟（大层命中 ACR 缓存，仅推 app 小层）；
    # 首次推送新增大层约需数十分钟，故超时放宽到 120 分钟。
    timeout-minutes: 120

    # 一次性 Postgres，仅供「迁移门禁」使用：验证全新空库能否一路迁移到 head。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_interview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ai_interview_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          AI_QWEN_API_KEY: ${{ secrets.AI_QWEN_API_KEY }}
        run: |
          set -Eeuo pipefail

          required_secrets="ACR_REGISTRY ACR_USERNAME ACR_PASSWORD SERVER_HOST SERVER_USER SERVER_PASSWORD AI_API_KEY POLLINATIONS_API_KEY POSTGRES_PASSWORD REDIS_PASSWORD AI_QWEN_API_KEY"
          for secret_name in $required_secrets; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required GitHub Actions secret: $secret_name"
              exit 1
            fi
          done

      # ---------------- 质量门禁（失败即阻断部署） ----------------
      # 背景：此前唯一的「质量检查」是 eval_gate.py，而它自己复制了一份评分逻辑、
      # 从不 import 生产代码，因此恒过 —— 线上「正常技术回答被判 4 分」的 bug 就是
      # 这样一路绿灯进生产的。现在改为三道真门禁：ruff / pytest / 直测生产代码的评测。
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-interview-backend/requirements.txt

      - name: Install quality-gate dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r ai-interview-backend/requirements.txt
          pip install ruff==0.16.10 pytest==9.1.1

      - name: Lint (ruff)
        working-directory: ai-interview-backend
        run: ruff check app tests scripts

      - name: Backend tests
        working-directory: ai-interview-backend
        run: python -m pytest tests -q

      # 迁移门禁：断言「全新空库能一路迁移到 head，且结果与模型定义完全一致」。
      # 背景：曾有 9 张表只有模型、没有迁移 —— 全新环境 `alembic upgrade head` 直接失败，
      # 环境无法重建（无 staging、无灾备、本地无法复现线上 schema）。这一步把「从零重建」
      # 变成每次推送都验证的硬门禁，用的是上面那个一次性 Postgres 服务。
      - name: Migration gate (rebuild from empty database)
        working-directory: ai-interview-backend
        env:
          ENV: development
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: ai_interview_ci
        run: |
          set -Eeuo pipefail
          echo "=== 全新空库执行 alembic upgrade head ==="
          python -m alembic upgrade head
          echo "=== 校验迁移结果与模型定义是否一致 ==="
          python scripts/check_migration_state.py

      - name: Evaluation gate
        working-directory: ai-interview-backend
        run: python scripts/eval_gate.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            ai-interview-frontend/package-lock.json
            ai-interview-admin/package-lock.json

      # 只做「能否构建成功」的编译校验，构建产物写到临时目录，不触碰仓库里被 Git 跟踪的
      # dist/（线上前端由宿主机目录挂载 dist，是否更新由本地重建决定，CI 不参与）。
      - name: Frontend build check
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -Eeuo pipefail
          for app in ai-interview-frontend ai-interview-admin; do
            echo "=== 构建校验: $app ==="
            (
              cd "$app"
              npm ci --no-audit --no-fund
              npm run build -- --outDir .ci-build-check --emptyOutDir
            )
            rm -rf "$app/.ci-build-check"
          done

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            -t "$IMAGE_REPOSITORY:latest" \
            ./ai-interview-backend

      - name: Push backend image
        run: |
          docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker push "$IMAGE_REPOSITORY:latest"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          DEPLOY_COMMIT: ${{ github.sha }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_QWEN_API_KEY: ${{ secrets.AI_QWEN_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          envs: BACKEND_IMAGE,DEPLOY_COMMIT,AI_API_KEY,AI_QWEN_API_KEY,POLLINATIONS_API_KEY,POSTGRES_PASSWORD,REDIS_PASSWORD
          script: |
            set -Eeuo pipefail

            required_secrets="AI_API_KEY AI_QWEN_API_KEY POLLINATIONS_API_KEY POSTGRES_PASSWORD REDIS_PASSWORD"
            for secret_name in $required_secrets; do
              if [ -z "${!secret_name:-}" ]; then
                echo "Missing required GitHub Actions secret: $secret_name"
                exit 1
              fi
            done

            cd /home/deploy/ai-interview
            git stash push --include-untracked --message "deploy-$DEPLOY_COMMIT" || true
            git pull --ff-only origin main
            cd ai-interview-backend

            echo "Deploy commit: $DEPLOY_COMMIT"
            echo "Deploy image: $BACKEND_IMAGE"
            echo "Disk usage:"
            df -h / /home
            echo "Memory usage:"
            free -h || true
            echo "Container status before deploy:"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'

            timestamp=$(date +%Y%m%d%H%M%S)
            backup_dir="/home/deploy/ai-interview/backups"
            mkdir -p "$backup_dir"

            echo "Backing up PostgreSQL..."
            docker exec ai-interview-postgres pg_dump -U postgres -d postgres -Fc > "$backup_dir/postgres-$timestamp.dump"
            test -s "$backup_dir/postgres-$timestamp.dump"
            chmod 600 "$backup_dir/postgres-$timestamp.dump"

            echo "Backing up current .env..."
            if [ -f .env ]; then
              cp -p .env "$backup_dir/env-$timestamp.backup"
              chmod 600 "$backup_dir/env-$timestamp.backup"
            fi

            echo "Pruning backups older than 14 days..."
            find "$backup_dir" -maxdepth 1 -type f -mtime +14 -delete 2>/dev/null || true
            ls -lh "$backup_dir" | tail -5 || true

            echo "Synchronizing PostgreSQL password after backup..."
            postgres_password_sql=${POSTGRES_PASSWORD//\'/\'\'}
            printf "ALTER ROLE postgres PASSWORD '%s';\n" "$postgres_password_sql" \
              | docker exec -i ai-interview-postgres psql -U postgres -d postgres \
                  -v ON_ERROR_STOP=1

            export BACKEND_IMAGE="$BACKEND_IMAGE"

            echo "Writing complete .env..."

            POLLINATIONS_API_KEY="$POLLINATIONS_API_KEY" \
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            REDIS_PASSWORD="$REDIS_PASSWORD" \
            python3 - <<'PY'
            import os
            import re
            import secrets
            from pathlib import Path

            env_path = Path('.env')
            existing = env_path.read_text(encoding='utf-8') if env_path.exists() else ''
            values = {
                'ENV': 'production',
                'PROJECT_NAME': 'AI-Interview',
                'API_V1_STR': '/api/v1',
                'API_PORT': '8006',
                'API_WORKERS': '2',
                'ALGORITHM': 'HS256',

                'POSTGRES_USER': 'postgres',
                'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
                'POSTGRES_HOST': 'postgres',
                'POSTGRES_PORT': '5432',
                'POSTGRES_DB': 'postgres',
                'REDIS_HOST': 'redis',
                'REDIS_PORT': '6379',
                'REDIS_PASSWORD': os.environ['REDIS_PASSWORD'],
                'XAI_API_KEY': os.environ['AI_API_KEY'],
                'GROK_MODELS_BASE_URL': 'https://sub.anzhiyu.com/v1',
                'GROK_MODEL': 'grok-4.3',
                'AI_API_KEY': os.environ['AI_API_KEY'],
                'AI_BASE_URL': 'https://sub.anzhiyu.com/v1',
                'AI_MODEL': 'grok-4.3',
                'AI_QWEN_API_KEY': os.environ['AI_QWEN_API_KEY'],
                'AI_QWEN_BASE_URL': 'https://dashscope.aliyuncs.com/compatible-mode/v1',
                'AI_QWEN_MODEL': 'qwen-plus',
                'POLLINATIONS_API_KEY': os.environ['POLLINATIONS_API_KEY'],
            }

            output = []
            seen = set()
            assignment = re.compile(r'^([A-Za-z_][A-Za-z0-9_]*)=(.*)$')
            for line in existing.splitlines():
                match = assignment.match(line)
                if not match:
                    if line.strip() or output:
                        output.append(line)
                    continue
                key = match.group(1)
                if key in values:
                    output.append(f'{key}={values[key]}')
                    seen.add(key)
                else:
                    output.append(line)

            if output and output[-1] != '':
                output.append('')
            for key, value in values.items():
                if key not in seen:
                    output.append(f'{key}={value}')

            # --- SECRET_KEY：生产环境必须持有独立的强随机密钥 ---
            # 策略：已存在强密钥时原样保留（每次部署都重新生成会让全体用户登录态失效）；
            #       缺失、为空或仍是弱占位值时，生成新的强随机密钥并落盘。
            # 与之配套：app/core/config.py 在 ENV=production 且密钥弱/缺失时会拒绝启动。
            weak_secret_keys = {
                '', 'your-secret-key-change-in-production', 'change-me',
                'changeme', 'secret', 'secret-key', 'dev', 'development',
            }
            existing_secret = None
            for line in existing.splitlines():
                match = assignment.match(line)
                if match and match.group(1) == 'SECRET_KEY':
                    existing_secret = match.group(2).strip()
                    break

            key_is_strong = (
                existing_secret is not None
                and existing_secret.lower() not in weak_secret_keys
                and len(existing_secret) >= 32
            )

            resolved = []
            had_secret_line = False
            for line in output:
                match = assignment.match(line)
                if match and match.group(1) == 'SECRET_KEY':
                    resolved.append(line if key_is_strong else f'SECRET_KEY={secrets.token_urlsafe(64)}')
                    had_secret_line = True
                else:
                    resolved.append(line)
            if not had_secret_line:
                resolved.append(f'SECRET_KEY={secrets.token_urlsafe(64)}')
            output = resolved

            print('SECRET_KEY: ' + ('preserved (已有强密钥)' if key_is_strong
                                    else 'generated (缺失或弱值，已生成新密钥；旧 token 将全部失效)'))

            env_path.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
            PY
            chmod 600 .env

            echo "Validating required .env variables..."
            required_env="ENV SECRET_KEY ALGORITHM API_V1_STR API_PORT API_WORKERS POSTGRES_USER POSTGRES_PASSWORD POSTGRES_HOST POSTGRES_PORT POSTGRES_DB REDIS_HOST REDIS_PORT REDIS_PASSWORD XAI_API_KEY GROK_MODELS_BASE_URL GROK_MODEL AI_API_KEY AI_BASE_URL AI_MODEL AI_QWEN_API_KEY AI_QWEN_BASE_URL AI_QWEN_MODEL POLLINATIONS_API_KEY"
            for env_name in $required_env; do
              if ! grep -q "^${env_name}=" .env; then
                echo "Missing required .env variable: $env_name"
                exit 1
              fi
            done

            echo "Validating Docker Compose configuration..."
            compose_config="/tmp/ai-interview-compose-$timestamp.yml"
            docker compose config > "$compose_config"
            grep -q 'POSTGRES_USER: postgres' "$compose_config"
            grep -q 'POSTGRES_DB: postgres' "$compose_config"
            grep -q 'container_name: ai-interview-app' "$compose_config"

            echo "Pulling backend image..."
            docker pull "$BACKEND_IMAGE"
            docker image inspect "$BACKEND_IMAGE" --format 'Pulled image={{.Id}}'

            # --- 回滚目标：记录当前正在运行的、已验证健康的镜像 ---
            # 注意：后面的镜像清理步骤必须保留这个镜像，否则回滚将无从下手
            #（历史行为是把非当前镜像全部删除，等于永远没有回滚目标）。
            echo "Recording rollback target..."
            previous_image=$(docker inspect --format='{{.Config.Image}}' ai-interview-app 2>/dev/null || true)
            if [ -n "$previous_image" ] && docker image inspect "$previous_image" >/dev/null 2>&1; then
              echo "$previous_image" > .last_good_image
              echo "  rollback target: $previous_image"
            else
              echo "  no healthy previous image found; rollback will not be available this run"
              rm -f .last_good_image
            fi

            # 仅在「应用镜像起不来」时自动回滚；数据库迁移失败不自动回滚，
            # 因为回退代码无法撤销已执行的迁移，会造成 schema 与代码不一致。
            rollback_to_last_good() {
              set +e
              if [ ! -s .last_good_image ]; then
                echo "  [rollback] no recorded target; skipping"
                return 1
              fi
              target=$(cat .last_good_image)
              if ! docker image inspect "$target" >/dev/null 2>&1; then
                echo "  [rollback] target image $target not present locally; skipping"
                return 1
              fi
              echo "  [rollback] reverting app container to $target"
              BACKEND_IMAGE="$target" docker compose up -d --force-recreate --no-deps app || return 1
              for i in $(seq 1 24); do
                code=$(docker exec ai-interview-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8006/api/v1/config/health', timeout=5).status)" 2>/dev/null || true)
                if [ "$code" = "200" ]; then
                  echo "  [rollback] app healthy again on $target"
                  return 0
                fi
                sleep 5
              done
              echo "  [rollback] app did not become healthy after rollback; manual intervention required"
              return 1
            }

            echo "Starting PostgreSQL and Redis..."
            docker compose up -d --force-recreate postgres redis
            for i in $(seq 1 30); do
              postgres_status=$(docker inspect --format='{{.State.Health.Status}}' ai-interview-postgres 2>/dev/null || echo missing)
              redis_status=$(docker inspect --format='{{.State.Health.Status}}' ai-interview-redis 2>/dev/null || echo missing)
              if [ "$postgres_status" = healthy ] && [ "$redis_status" = healthy ]; then
                break
              fi
              echo "Waiting for PostgreSQL/Redis healthy ($i/30): postgres=$postgres_status redis=$redis_status"
              sleep 5
            done
            test "$(docker inspect --format='{{.State.Health.Status}}' ai-interview-postgres)" = healthy
            test "$(docker inspect --format='{{.State.Health.Status}}' ai-interview-redis)" = healthy

            echo "Starting app..."
            docker compose up -d --force-recreate --no-deps app
            echo "Waiting for app process and HTTP health..."
            app_ready=false
            for i in $(seq 1 36); do
              app_status=$(docker inspect --format='{{.State.Status}}' ai-interview-app 2>/dev/null || echo missing)
              if [ "$app_status" != "running" ]; then
                echo "Waiting for app running ($i/36): $app_status"
                sleep 5
                continue
              fi

              direct_health_status=$(docker exec ai-interview-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8006/api/v1/config/health', timeout=5).status)" 2>/dev/null || true)
              echo "App readiness check ($i/36): status=$app_status http=${direct_health_status:-unavailable}"
              if [ "$direct_health_status" = "200" ]; then
                app_ready=true
                break
              fi
              sleep 5
            done

            if [ "$app_ready" != "true" ]; then
              echo "App failed to become ready; collecting diagnostics..."
              docker inspect --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} exit={{.State.ExitCode}}' ai-interview-app || true
              docker logs ai-interview-app --tail 200 || true
              echo "New image $BACKEND_IMAGE did not start; rolling back to previous image..."
              rollback_to_last_good || true
              exit 1
            fi

            echo "Running database migrations..."
            if ! docker exec ai-interview-app alembic upgrade head; then
              echo "❌ 数据库迁移失败：不执行自动回滚。"
              echo "   回退应用镜像无法撤销已执行/半执行的迁移，强行回滚会造成 schema 与代码不一致。"
              echo "   请人工确认迁移脚本后处理；本次部署的应用镜像为 $BACKEND_IMAGE"
              exit 1
            fi

            echo "Checking direct app health after migrations..."
            direct_health_status=$(docker exec ai-interview-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8006/api/v1/config/health', timeout=5).status)")
            test "$direct_health_status" = 200

            echo "Starting Celery worker..."
            docker compose up -d --force-recreate --no-deps celery-worker
            echo "Starting Celery beat..."
            docker compose up -d --force-recreate --no-deps celery-beat

            echo "Starting or reloading Nginx..."
            docker compose up -d --force-recreate --no-deps nginx

            echo "Deploying host Nginx config..."
            mkdir -p /var/www/letsencrypt
            cp /home/deploy/ai-interview/deploy/host-nginx/ai-interview.conf /etc/nginx/sites-available/ai-interview
            rm -f /etc/nginx/sites-enabled/default
            ln -sf /etc/nginx/sites-available/ai-interview /etc/nginx/sites-enabled/ai-interview
            nginx -t
            systemctl reload nginx || systemctl start nginx

            echo "Checking public health..."
            public_health_status=$(curl -sS -o /tmp/ai-interview-health.json -w '%{http_code}' http://localhost:80/api/v1/config/health)
            test "$public_health_status" = 200

            echo "Checking frontend, admin and API..."
            frontend_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/)
            admin_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/admin/)
            api_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/api/v1/config/release)
            echo "HTTPS status: frontend=$frontend_status admin=$admin_status api=$api_status"
            test "$frontend_status" = 200
            test "$admin_status" = 200
            test "$api_status" = 200

            echo "Final container status:"
            docker compose ps

            echo "Cleaning old backend images (keeping current + rollback target)..."
            backend_repo="${BACKEND_IMAGE%:*}"
            current_backend_image_id=$(docker image inspect "$BACKEND_IMAGE" --format '{{.Id}}')
            rollback_ref=$(cat .last_good_image 2>/dev/null || true)
            rollback_image_id=""
            if [ -n "$rollback_ref" ] && docker image inspect "$rollback_ref" >/dev/null 2>&1; then
              rollback_image_id=$(docker image inspect "$rollback_ref" --format '{{.Id}}')
              echo "Preserving rollback image: $rollback_ref"
            fi
            docker image ls "$backend_repo" --format '{{.Repository}}:{{.Tag}}' \
              | while read -r image_ref; do
                  if [ -z "$image_ref" ] || [ "$image_ref" = "$BACKEND_IMAGE" ] || [ "$image_ref" = "$rollback_ref" ]; then
                    continue
                  fi

                  image_id=$(docker image inspect "$image_ref" --format '{{.Id}}' 2>/dev/null || true)
                  if [ -n "$image_id" ] && [ "$image_id" != "$current_backend_image_id" ] && [ "$image_id" != "$rollback_image_id" ]; then
                    echo "Removing old backend image: $image_ref"
                    docker image rm -f "$image_ref" || true
                  fi
                done
            docker image prune -f || true
            docker builder prune -f || true
            docker system df || true

            echo "Installing daily backup timer..."
            BACKUP_SCRIPT="/home/deploy/ai-interview/ai-interview-backend/scripts/backup.sh"
            if [ -f "$BACKUP_SCRIPT" ]; then
              chmod 755 "$BACKUP_SCRIPT"
              cat > /etc/systemd/system/ai-interview-backup.service <<'UNIT'
            [Unit]
            Description=AI-Interview daily backup (postgres + redis + uploads + env)
            [Service]
            Type=oneshot
            WorkingDirectory=/home/deploy/ai-interview/ai-interview-backend
            Environment=BACKEND_DIR=/home/deploy/ai-interview/ai-interview-backend
            ExecStart=/bin/bash /home/deploy/ai-interview/ai-interview-backend/scripts/backup.sh
            UNIT
              cat > /etc/systemd/system/ai-interview-backup.timer <<'UNIT'
            [Unit]
            Description=Run AI-Interview backup daily
            [Timer]
            OnCalendar=*-*-* 03:30:00
            Persistent=true
            RandomizedDelaySec=600
            [Install]
            WantedBy=timers.target
            UNIT
              systemctl daemon-reload
              if systemctl enable --now ai-interview-backup.timer; then
                echo "Backup timer enabled:"
                systemctl list-timers 'ai-interview-backup*' --no-pager || true
              else
                echo "ERROR: 备份定时器启用失败 —— 部署本身已成功，但定时备份未生效，请人工检查！"
                systemctl status ai-interview-backup.timer --no-pager || true
              fi
            else
              echo "ERROR: 未找到 scripts/backup.sh，跳过定时备份安装"
            fi

            echo "Deployment completed successfully."

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -Eeuo pipefail

            echo "Waiting for containers..."
            for i in $(seq 1 12); do
              status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/api/v1/config/health || true)
              basic_status=$(curl -k -sS -o /dev/null -w '%{http_code}' https://localhost/health || true)
              if [ "$status" = 200 ] && [ "$basic_status" = 200 ]; then
                echo "Health checks passed: detailed=$status basic=$basic_status"
                exit 0
              fi
              echo "Health check $i/12 failed: detailed=$status basic=$basic_status"
              sleep 5
            done

            docker compose -f /home/deploy/ai-interview/ai-interview-backend/docker-compose.yml ps || true
            docker logs ai-interview-app --tail 100 || true
            docker logs ai-interview-celery-worker --tail 50 || true
            docker logs ai-interview-celery-beat --tail 50 || true
            exit 1
