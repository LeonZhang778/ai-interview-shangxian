# 开发环境覆盖配置
# 启动: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# 作用: 开启热重载, 暴露数据库端口, 使用 host 网络

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-interview:dev
    network_mode: host
    environment:
      - ENV=development
      - POSTGRES_HOST=localhost
      - POSTGRES_PORT=5434
      - REDIS_HOST=localhost
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  postgres:
    ports:
      - "5434:5432"

  redis:
    ports:
      - "6379:6379"

  nginx:
    profiles:
      - donotstart

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-interview:dev
    environment:
      - ENV=development
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: ai-interview:dev
    environment:
      - ENV=development
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
